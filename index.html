  <body class="booting">

 <div id="sound-panel" class="sound-panel" popover>

        <label class="sound-volume"><span data-i18n="volume"></span> <input id="sound-volume" type="range" min="0" max="100" step="5" /></label>
      </div>
      <div id="save-banner" class="save-banner" role="alert" hidden>

        <button id="save-retry" type="button" data-i18n="saveRetry"></button>

      <main>
        <section id="welcome" class="panel welcome hidden">

          <button id="daily" class="daily-button" type="button">✧ <span data-i18n="daily"></span> <span class="arrow">→</span></button>

          </div>
          <button class="subtle-button" id="shop-back" type="button"></button>
        </section>

        <section id="visit" class="panel visit hidden" aria-live="polite">
          <div class="visit-head">
            <div id="visit-portrait" class="visit-portrait"></div>
            <div class="visit-speech">
              <p class="eyebrow"><span id="visit-name"></span> <span id="visit-tag" class="tag"></span></p>
              <p id="visit-intro" class="speech"></p>
